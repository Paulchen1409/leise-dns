<!doctype html>
<html lang="de" data-transparency="full" data-motion="full" data-refraction="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Leise DNS · Schnellzugriff</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/materials.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/popup.css">
  <script defer src="i18n.js"></script>
  <script defer src="icons.js"></script>
  <script defer src="ui.js"></script>
  <script defer src="popup.js"></script>
</head>
<body class="popup">
  <div class="popup-panel tone-neutral" id="panel">
    <div class="popup-light" aria-hidden="true"></div>
    <header class="popup-head">
      <span class="popup-brand"><i data-brand="pbm"></i><span>Leise <span>DNS</span></span></span>
      <span class="popup-local"><i data-icon="computer" class="icon-sm"></i><span data-i18n="local.title">Nur auf diesem PC</span></span>
    </header>

    <section class="popup-status" aria-live="polite">
      <div class="popup-symbol" id="popup-symbol" aria-hidden="true"></div>
      <div class="popup-copy">
        <h1 id="popup-title" data-i18n="checking">Wird geprüft …</h1>
        <p id="popup-description" data-i18n="popup.desc">Dein lokaler DNS-Schutz.</p>
      </div>
      <button class="switch switch-md" id="popup-toggle" role="switch" aria-checked="false" aria-label="Schutz einschalten" data-i18n-aria="popup.toggleOn"><span class="switch-track-fill"></span><span class="switch-knob"><span class="spinner"></span></span></button>
    </section>
    <div class="popup-error" id="popup-error" role="alert" hidden><i data-icon="alert" class="icon-sm"></i><span id="popup-error-text"></span></div>

    <p class="popup-label" data-i18n="pause.title">Schutz pausieren</p>
    <div class="popup-pause" role="group" aria-label="Schutz pausieren" data-i18n-aria="pause.title">
      <button class="btn" data-mode="5"><i data-icon="timer"></i><span data-i18n="pause.5">5 Minuten</span></button>
      <button class="btn" data-mode="30"><i data-icon="timer"></i><span data-i18n="pause.30">30 Minuten</span></button>
      <button class="btn" data-mode="restart"><i data-icon="restart"></i><span data-i18n="pause.restartShort">Bis Neustart</span></button>
      <button class="btn" data-mode="off"><i data-icon="power"></i><span data-i18n="pause.off">Dauerhaft aus</span></button>
    </div>

    <footer class="popup-actions">
      <button class="btn btn-accent" id="open"><span data-i18n="popup.open">Dashboard öffnen</span><i data-icon="arrow"></i></button>
      <button class="btn btn-quiet popup-quit" id="quit"><i data-icon="power"></i><span data-i18n="popup.quit">Beenden &amp; DNS zurücksetzen</span></button>
    </footer>
  </div>
</body>
</html>
